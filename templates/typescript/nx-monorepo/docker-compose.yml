services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: __NAMESPACE__
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgres://user:pass@postgres:5432/__NAMESPACE__
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      - postgres

volumes:
  pgdata:
